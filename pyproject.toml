[project]
name = "crossing-count"
version = "0.1.0"
description = "Assisted, human-verified crossing counts for validating people-counting sensors"
authors = [{ name = "Parham Forozan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "av>=12.0",
    "ultralytics>=8.3",
    "lap>=0.5.13",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-pptx>=1.0.2",
    "keyring>=25.7.0",
    "tzdata>=2026.4",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossing_count"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-pptx ships no type hints; its constructors count as untyped calls.
module = ["crossing_count.report_pptx"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# int(round(x)) is deliberate: round() of a numpy scalar is not always a Python int.
ignore = ["RUF046", "RUF007", "C408"]
