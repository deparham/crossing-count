# Builds the Windows installer (CrossingCount-Setup-<version>.exe) on GitHub's
# Windows machines. Download it from the run's "Artifacts" section.
#
# Each build of main is also published as the release win-b<run number>, which installed
# apps check for their update notice (the newest three are kept). The repository secrets
# RETAILNEXT_BRANDS and UPDATE_TOKEN, when set, are built in (packaging/build_info.py).
name: Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the build as a release

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q

  installer:
    needs: tests  # no installer, and no update notice, from code whose tests fail
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group build

      - name: Model weights (the same files as on the development Mac)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $weights = @{
            "yolo11s.pt" = "85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5"
            "yolo11m.pt" = "d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95"
          }
          foreach ($name in $weights.Keys) {
            Invoke-WebRequest "https://github.com/ultralytics/assets/releases/download/v8.3.0/$name" -OutFile "models/$name"
            $hash = (Get-FileHash "models/$name" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $weights[$name]) { throw "$name has checksum $hash, expected $($weights[$name])" }
          }

      - name: Build number, and what is built in
        env:
          RETAILNEXT_BRANDS: ${{ secrets.RETAILNEXT_BRANDS }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: uv run python packaging/build_info.py win

      - name: Bundle with PyInstaller
        run: uv run pyinstaller packaging/crossing_count.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the bundle
        shell: pwsh
        run: |
          # a windowed program: wait for it, and read what it wrote to its log
          $env:CROSSING_COUNT_HOME = "$env:RUNNER_TEMP\cc-home"
          $p = Start-Process -FilePath dist\CrossingCount\CrossingCount.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:CROSSING_COUNT_HOME\logs\app.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.${{ github.run_number }}" }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: CrossingCount-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish for the apps' update notice
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win-b${{ github.run_number }}"
          $exe = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          gh release create $tag $exe --target "${{ github.sha }}" --title "Windows build ${{ github.run_number }}" --notes "$(git log -1 --format=%s)"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^win-b\d+$' } |
            Sort-Object { [int]($_ -replace '^win-b', '') } -Descending |
            Select-Object -Skip 3
          foreach ($t in $old) { gh release delete $t --yes --cleanup-tag }
