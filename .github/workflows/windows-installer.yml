# Builds the Windows installer (CrossingCount-Setup-<version>.exe) on GitHub's
# Windows machines. Download it from the run's "Artifacts" section.
#
# Each build of main is also published as the release win-b<run number>, which installed
# apps check for their update notice (the newest three are kept). The repository secrets
# RETAILNEXT_BRANDS and UPDATE_TOKEN, when set, are built in (packaging/build_info.py).
name: Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the build as a release

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q

  installer:
    needs: tests  # no installer, and no update notice, from code whose tests fail
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group build

      - name: Model weights (the same files as on the development Mac)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          # each file with its checksum and the release it comes from: YOLO26's weights are
          # in a later release than YOLO11's
          $weights = @{
            "yolo26m.pt" = @{ sha = "401cea9ab23ad19246ff7744859816bc599f350e93c9dd30367b6f0a0745d0b7"; tag = "v8.4.0" }
            "yolo26s.pt" = @{ sha = "646f8bc3fe0a656803d95c294f7852321748cb29d13466a1af8862e2db384a1b"; tag = "v8.4.0" }
            "yolo11s.pt" = @{ sha = "85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5"; tag = "v8.3.0" }
            "yolo11m.pt" = @{ sha = "d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95"; tag = "v8.3.0" }
          }
          foreach ($name in $weights.Keys) {
            $want = $weights[$name]
            Invoke-WebRequest "https://github.com/ultralytics/assets/releases/download/$($want.tag)/$name" -OutFile "models/$name"
            $hash = (Get-FileHash "models/$name" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $want.sha) { throw "$name has checksum $hash, expected $($want.sha)" }
          }

      - name: Build number, and what is built in
        env:
          RETAILNEXT_BRANDS: ${{ secrets.RETAILNEXT_BRANDS }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: uv run python packaging/build_info.py win

      - name: Bundle with PyInstaller
        run: uv run pyinstaller packaging/crossing_count.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the bundle
        shell: pwsh
        run: |
          # a windowed program: wait for it, and read what it wrote to its log
          $env:CROSSING_COUNT_HOME = "$env:RUNNER_TEMP\cc-home"
          $p = Start-Process -FilePath dist\CrossingCount\CrossingCount.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:CROSSING_COUNT_HOME\logs\app.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Sign the program, if a certificate is set up
        id: sign
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}  # the .pfx file, base64
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) {
            Write-Host "::warning::No WINDOWS_CERT_PFX secret: this build is unsigned, so Windows warns that the publisher is unknown (docs/INSTALL_WINDOWS.md)."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "signtool.exe not found on the runner" }
          # SHA-256, and timestamped so the signature outlives the certificate
          & $tool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\CrossingCount\CrossingCount.exe
          if ($LASTEXITCODE -ne 0) { throw "signing the program failed" }
          "signed=true" >> $env:GITHUB_OUTPUT
          "tool=$($tool.FullName)" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT

      - name: Installer with Inno Setup
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.${{ github.run_number }}" }
          $args = @("/DAppVersion=$version")
          if ("${{ steps.sign.outputs.signed }}" -eq "true") {
            # $f is the file Inno Setup passes to the sign tool
            $args += "/DSign"
            $args += "/Smysign=`"${{ steps.sign.outputs.tool }}`" sign /f `"${{ steps.sign.outputs.pfx }}`" /p `"$env:CERT_PASSWORD`" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f"
          }
          & $iscc @args packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: CrossingCount-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish for the apps' update notice
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win-b${{ github.run_number }}"
          $exe = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          # the checksum goes in the notes: anyone can check the download is this build
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $signed = if ("${{ steps.sign.outputs.signed }}" -eq "true") { "Signed with the project's code-signing certificate." }
                    else { "Not signed: Windows will warn that the publisher is unknown. See docs/INSTALL_WINDOWS.md." }
          $notes = "$(git log -1 --format=%s)`n`nSHA-256: ``$hash```n`n$signed"
          gh release create $tag $exe --target "${{ github.sha }}" --title "Windows build ${{ github.run_number }}" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^win-b\d+$' } |
            Sort-Object { [int]($_ -replace '^win-b', '') } -Descending |
            Select-Object -Skip 3
          foreach ($t in $old) { gh release delete $t --yes --cleanup-tag }
