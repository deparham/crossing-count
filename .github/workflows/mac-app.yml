# Builds the Mac app (CrossingCount-<version>.dmg, Apple Silicon) on GitHub's Macs.
# Download it from the run's "Artifacts" section, open it and drag CrossingCount to
# Applications. It is not signed with an Apple Developer ID: the first time, open it from
# System Settings > Privacy & Security > Open Anyway.
#
# Each build of main is also published as the release mac-b<run number>, which installed
# apps check for their update notice (the newest three are kept). The repository secrets
# RETAILNEXT_BRANDS and UPDATE_TOKEN, when set, are built in (packaging/build_info.py).
name: Mac app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the build as a release

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group build

      - name: Tests
        run: uv run pytest -q

      - name: Model weights (the same files as on the development Mac)
        run: |
          mkdir -p models
          # fetch <file> <sha256> [release tag]: YOLO26's weights are in a later release
          fetch() {
            curl -sSL -o "models/$1" "https://github.com/ultralytics/assets/releases/download/${3:-v8.3.0}/$1"
            echo "$2  models/$1" | shasum -a 256 -c -
          }
          fetch yolo26m.pt 401cea9ab23ad19246ff7744859816bc599f350e93c9dd30367b6f0a0745d0b7 v8.4.0
          fetch yolo26s.pt 646f8bc3fe0a656803d95c294f7852321748cb29d13466a1af8862e2db384a1b v8.4.0
          fetch yolo11s.pt 85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5
          fetch yolo11m.pt d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95

      - name: Build number, and what is built in
        env:
          RETAILNEXT_BRANDS: ${{ secrets.RETAILNEXT_BRANDS }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: uv run python packaging/build_info.py mac

      - name: Bundle with PyInstaller
        run: uv run pyinstaller packaging/crossing_count.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the app
        run: dist/CrossingCount.app/Contents/MacOS/CrossingCount --self-test

      - name: Disk image
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p dmg && cp -R dist/CrossingCount.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname CrossingCount -srcfolder dmg -ov -format UDZO "CrossingCount-${version}.dmg"
          echo "DMG=CrossingCount-${version}.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: CrossingCount-mac
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Publish for the apps' update notice
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-b${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$DMG" --target "$GITHUB_SHA" \
            --title "Mac build ${GITHUB_RUN_NUMBER}" --notes "$(git log -1 --format=%s)"
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^mac-b\([0-9][0-9]*\)$/\1/p' | sort -rn | tail -n +4 \
            | while read -r n; do gh release delete "mac-b$n" --yes --cleanup-tag; done
